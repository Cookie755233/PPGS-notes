<!-- Auto Shrink Header -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var header = document.querySelector(".hextra-nav-container");
    if (!header) return;

    var lastScroll = window.scrollY;
    var minScroll = 80;      // don't hide near the very top
    var hideDelta = 24;      // must scroll down at least this much to hide
    var showDelta = 8;       // must scroll up at least this much to show
    var locked = false;
    var lockTime = 300;      // ms to ignore scroll events after a toggle

    function setState(hidden) {
      if (locked) return;
      var isHidden = header.classList.contains("hx-nav-hidden");
      if (hidden === isHidden) return;

      locked = true;
      if (hidden) {
        header.classList.add("hx-nav-hidden");
        document.body.classList.add("hx-nav-collapsed");
      } else {
        header.classList.remove("hx-nav-hidden");
        document.body.classList.remove("hx-nav-collapsed");
      }
      setTimeout(function () { locked = false; }, lockTime);
    }

    window.addEventListener(
      "scroll",
      function () {
        var current = window.scrollY;
        var diff = current - lastScroll;

        if (current <= minScroll) {
          setState(false);
        } else if (diff > hideDelta) {
          setState(true);
        } else if (diff < -showDelta) {
          setState(false);
        }

        if (!locked) lastScroll = current;
      },
      { passive: true }
    );
  });
</script>


<!-- Footer fix -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var footer = document.querySelector(".hextra-footer");
    if (!footer) return;

    function adjustFooter() {
      footer.style.marginTop = "0px";

      var rect = footer.getBoundingClientRect();
      var footerTop = rect.top;
      var footerHeight = rect.height;
      var availableSpace = window.innerHeight - footerTop - footerHeight;

      if (availableSpace > 0) {
        footer.style.marginTop = availableSpace + "px";
      }
    }

    adjustFooter();
    window.addEventListener("resize", adjustFooter);

    if (document.readyState === "complete") {
      adjustFooter();
    } else {
      window.addEventListener("load", adjustFooter);
    }
  });
</script>

<!-- Header fix -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var nav = document.querySelector(".hextra-nav-container nav");
    var logo = nav ? nav.querySelector("a") : null;
    var searchWrapper = nav ? nav.querySelector(".hextra-search-wrapper") : null;
    if (!nav || !logo || !searchWrapper) return;

    function getDocsBase() {
      var link = document.querySelector('.hextra-sidebar-container a[href*="/docs/"]');
      if (!link) return "/docs/";
      var href = link.getAttribute("href");
      var idx = href.indexOf("/docs/");
      return href.slice(0, idx + "/docs/".length);
    }

    var base = getDocsBase();
    var topics = [
      { label: "COM", slug: "com" },
      { label: "FAR/AIM", slug: "far" },
      { label: "GN|RN & IR", slug: "gn" },
      { label: "INS & EE|RN2", slug: "ins" },
      { label: "MAT", slug: "mat" },
      { label: "MET", slug: "met" },
      { label: "PERF", slug: "perf" }
    ];

    var path = window.location.pathname;

    var topicNav = document.createElement("div");
    topicNav.id = "header-topic-nav";

    topics.forEach(function (t) {
      var a = document.createElement("a");
      a.href = base + t.slug + "/";
      a.textContent = t.label;
      var segment = "/" + t.slug + "/";
      if (path.indexOf(base + t.slug + "/") === 0) {
        a.classList.add("active");
      }
      topicNav.appendChild(a);
    });

    var divider = document.createElement("div");
    divider.id = "header-topic-divider";

    nav.insertBefore(topicNav, searchWrapper);
    nav.insertBefore(divider, searchWrapper);
  });
</script>

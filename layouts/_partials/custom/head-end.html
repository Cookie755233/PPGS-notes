<!-- Collapsible Header -->
{{ if .Params.use_collapsible }}
  {{ partial "collapsable-header.html" . }}
{{ end }}

<!-- Special rule (basically "truncate list") (FAR/AIM) -->
{{ if index .Page.Params "set-special-rule" }}
<style>
  {{ readFile "layouts/_partials/custom/special-rule.css" | safeCSS }}
</style>
<script>
  {{ readFile "layouts/_partials/custom/special-rule.js" | safeJS }}
</script>
{{ end }}

<!-- Sticky list (should be "show current section") but whatever-->
{{ if index .Page.Params "sticky-list" }}
<style>
  {{ readFile "layouts/_partials/custom/sticky-list.css" | safeCSS }}
</style>
<script>
  {{ readFile "layouts/_partials/custom/sticky-list.js" | safeJS }}
</script>
{{ end }}

<!-- Hide TOC -->
{{ if .Params.hide_toc }}
<style>
  .hextra-toc {
    display: none !important;
  }
</style>
{{ end }}

<!-- Custom chatbox format (COMM)-->
{{ if index .Page.Params "chat_radio" }}
<style>
  {{ readFile "layouts/_partials/custom/chat-radio.css" | safeCSS }}
</style>
<script>
  {{ readFile "layouts/_partials/custom/chat-radio.js" | safeJS }}
</script>
<script>
  document.documentElement.classList.add("chat-radio-page");
</script>
{{ end }}
